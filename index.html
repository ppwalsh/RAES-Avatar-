<!DOCTYPE html>
<html>
<head>
    <title>RAES Avatar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        #did-agent-container {
            min-height: 500px;
        }
    </style>
</head>
<body>
    <h1>Welcome to RAES Avatar</h1>
    
    <div id="did-agent-container"></div>
    
    <script type="module">
        // Initialize D-ID Agent
        async function initializeDIDAgent() {
            try {
                // Load the D-ID agent script
                const script = document.createElement('script');
                script.type = 'module';
                script.src = 'https://agent.d-id.com/v2/index.js';
                script.setAttribute('data-mode', 'fabio');
                script.setAttribute('data-client-key', 'ck_XYoKm8DegscC7-KX2jikE');
                script.setAttribute('data-agent-id', 'v2_agt_lqvZfN8H');
                script.setAttribute('data-name', 'did-agent');
                script.setAttribute('data-monitor', 'true');
                script.setAttribute('data-orientation', 'horizontal');
                script.setAttribute('data-position', 'right');
                script.setAttribute('data-open-mode', 'compact');
                
                document.body.appendChild(script);
                
                console.log('D-ID Agent script loaded');
            } catch (error) {
                console.error('Error initializing D-ID Agent:', error);
            }
        }
        
        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeDIDAgent);
        } else {
            initializeDIDAgent();
        }
    </script>
</body>
</html>
